
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="devTitle devDesc">
  <title id="devTitle">Developer at desk illustration with code monitor, blinking cursor, coffee steam, and floating code symbols</title>
  <desc id="devDesc">Vector illustration of a software engineer coding at a dual-panel workstation with a steaming mug and code tokens.</desc>
  <defs>
    <linearGradient id="sceneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <style>
    .cursor-blink { animation: cursorBlink 1.1s steps(2, start) infinite; }
    .steam-1 { animation: steamRise 3.4s ease-in-out infinite; }
    .steam-2 { animation: steamRise 3.4s ease-in-out 1.1s infinite; }
    .sym-a { animation: symFade 4s ease-in-out infinite; }
    .sym-b { animation: symFade 4s ease-in-out 1.3s infinite; }
    .sym-c { animation: symFade 4s ease-in-out 2.5s infinite; }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes steamRise {
      0% { opacity: 0.2; transform: translateY(4px); }
      50% { opacity: 0.78; transform: translateY(-4px); }
      100% { opacity: 0.2; transform: translateY(4px); }
    }
    @keyframes symFade {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor-blink, .steam-1, .steam-2, .sym-a, .sym-b, .sym-c { animation: none; opacity: 0.85; transform: none; }
    }
  </style>

  <rect width="900" height="360" rx="16" fill="url(#sceneBg)"/>
  <rect x="1.5" y="1.5" width="897" height="357" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Floating Code Symbols inside static translated groups -->
  <g transform="translate(96, 86)">
    <g class="sym-a">
      <rect x="-18" y="-24" width="64" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="14" y="0" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="18" font-weight="700">{ }</text>
    </g>
  </g>

  <g transform="translate(148, 174)">
    <g class="sym-b">
      <rect x="-24" y="-22" width="76" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="14" y="1" text-anchor="middle" fill="#a5b4fc" font-family="Consolas, monospace" font-size="16" font-weight="700">&lt;/&gt;</text>
    </g>
  </g>

  <g transform="translate(744, 88)">
    <g class="sym-c">
      <rect x="-22" y="-22" width="72" height="34" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="14" y="1" text-anchor="middle" fill="#22d3ee" font-family="Consolas, monospace" font-size="16" font-weight="700">=&gt;</text>
    </g>
  </g>

  <g transform="translate(772, 172)">
    <g class="sym-a">
      <rect x="-20" y="-22" width="68" height="34" rx="8" fill="#1e293b" stroke="#34d399" stroke-opacity="0.45"/>
      <text x="14" y="1" text-anchor="middle" fill="#34d399" font-family="Consolas, monospace" font-size="15" font-weight="700">RAG</text>
    </g>
  </g>

  <!-- Desk Surface -->
  <g transform="translate(110, 272)">
    <rect x="0" y="0" width="680" height="16" rx="6" fill="url(#deskTop)"/>
    <rect x="36" y="16" width="16" height="72" fill="#1e293b"/>
    <rect x="628" y="16" width="16" height="72" fill="#1e293b"/>
  </g>

  <!-- Monitor Stand & Monitor -->
  <g transform="translate(278, 84)">
    <rect x="148" y="162" width="48" height="26" fill="#475569"/>
    <rect x="116" y="184" width="112" height="8" rx="4" fill="#64748b"/>
    <rect x="0" y="0" width="344" height="166" rx="12" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <rect x="12" y="12" width="320" height="142" rx="6" fill="url(#screenGlow)"/>

    <!-- Editor Header Dots -->
    <circle cx="26" cy="24" r="4" fill="#f87171"/>
    <circle cx="40" cy="24" r="4" fill="#fbbf24"/>
    <circle cx="54" cy="24" r="4" fill="#34d399"/>

    <!-- Code Lines -->
    <rect x="24" y="42" width="96" height="7" rx="3.5" fill="#818cf8"/>
    <rect x="128" y="42" width="110" height="7" rx="3.5" fill="#38bdf8"/>
    <rect x="42" y="58" width="144" height="7" rx="3.5" fill="#22d3ee" opacity="0.85"/>
    <rect x="42" y="74" width="186" height="7" rx="3.5" fill="#cbd5e1" opacity="0.7"/>
    <rect x="60" y="90" width="128" height="7" rx="3.5" fill="#34d399" opacity="0.85"/>
    <rect x="60" y="106" width="154" height="7" rx="3.5" fill="#fbbf24" opacity="0.8"/>
    <rect x="42" y="122" width="84" height="7" rx="3.5" fill="#38bdf8"/>
    <!-- Blinking Cursor -->
    <rect x="132" y="120" width="8" height="12" rx="1.5" fill="#22d3ee" class="cursor-blink"/>
  </g>

  <!-- Developer Silhouette / Character at Desk -->
  <g transform="translate(414, 152)">
    <!-- Chair Back -->
    <rect x="-12" y="28" width="96" height="86" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Torso / Hoodie -->
    <path d="M 4 120 C 4 84, 68 84, 68 120 Z" fill="#0284c7"/>
    <!-- Neck & Head -->
    <rect x="28" y="64" width="16" height="20" rx="6" fill="#e2b49a"/>
    <circle cx="36" cy="44" r="24" fill="#e2b49a"/>
    <!-- Hair & Glasses -->
    <path d="M 12 40 C 12 18, 60 18, 60 40 C 52 30, 20 30, 12 40 Z" fill="#0f172a"/>
    <rect x="19" y="38" width="14" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="2.2"/>
    <rect x="39" y="38" width="14" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="2.2"/>
    <line x1="33" y1="43" x2="39" y2="43" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Coffee Mug & Rising Steam -->
  <g transform="translate(652, 232)">
    <g class="steam-1">
      <path d="M 14 -6 C 10 -14, 20 -20, 15 -28" fill="none" stroke="#cbd5e1" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g class="steam-2">
      <path d="M 26 -8 C 22 -16, 32 -22, 27 -30" fill="none" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <rect x="4" y="0" width="32" height="38" rx="6" fill="#f8fafc"/>
    <rect x="4" y="0" width="32" height="8" rx="3" fill="#38bdf8"/>
    <path d="M 36 8 C 48 8, 48 28, 36 28" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
