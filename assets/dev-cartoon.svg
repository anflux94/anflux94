<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="devTitle devDesc">
  <title id="devTitle">Funny meme-style comic developer at a desk saying This is fine during late-night debugging</title>
  <desc id="devDesc">Original comic stick-figure developer in a hoodie and glasses holding a steaming coffee mug beside a monitor with a blinking cursor, playful background bug flames, a nervous rubber duck, and floating code symbols.</desc>

  <defs>
    <linearGradient id="comicWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#291720"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#ef4444" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <style>
    .cursor-blink { animation: cursorBlink 1s steps(2, start) infinite; }
    .steam-1 { animation: steamRise 2.8s ease-in-out infinite; }
    .steam-2 { animation: steamRise 2.8s ease-in-out 0.9s infinite; }
    .flame-flicker { animation: flicker 1.8s ease-in-out infinite; }
    .flame-flicker-alt { animation: flicker 2.1s ease-in-out 0.7s infinite; }
    .sym-float { animation: symFloat 3.8s ease-in-out infinite; }
    .sym-float-alt { animation: symFloat 4.1s ease-in-out 1.4s infinite; }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes steamRise {
      0% { opacity: 0.25; transform: translateY(5px); }
      50% { opacity: 0.9; transform: translateY(-6px); }
      100% { opacity: 0.25; transform: translateY(5px); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.85; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.06); }
    }
    @keyframes symFloat {
      0%, 100% { opacity: 0.78; transform: translateY(0px); }
      50% { opacity: 1; transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor-blink, .steam-1, .steam-2, .flame-flicker, .flame-flicker-alt, .sym-float, .sym-float-alt {
        animation: none;
        opacity: 0.92;
        transform: none;
      }
    }
  </style>

  <!-- Comic Panel Frame & Warm Background -->
  <rect width="960" height="380" rx="16" fill="url(#comicWall)"/>
  <rect width="960" height="380" rx="16" fill="url(#fireGlow)"/>
  <rect x="4" y="4" width="952" height="372" rx="13" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-opacity="0.22"/>

  <!-- Playful Cartoon "Prod Bugs" Flames Behind Desk -->
  <g transform="translate(86, 206)">
    <g class="flame-flicker">
      <path d="M 18 82 C -2 64, 4 36, 18 18 C 20 34, 30 34, 34 8 C 48 28, 56 54, 36 82 Z" fill="url(#flameOuter)" opacity="0.88"/>
      <path d="M 22 82 C 14 70, 18 52, 26 42 C 32 54, 36 68, 30 82 Z" fill="#fef08a"/>
    </g>
  </g>
  <g transform="translate(154, 224)">
    <g class="flame-flicker-alt">
      <path d="M 14 64 C 0 50, 4 28, 16 12 C 20 26, 26 24, 28 4 C 40 20, 44 42, 30 64 Z" fill="url(#flameOuter)" opacity="0.8"/>
    </g>
  </g>
  <g transform="translate(810, 210)">
    <g class="flame-flicker">
      <path d="M 18 78 C 0 60, 6 34, 20 14 C 22 30, 30 28, 34 6 C 48 24, 52 50, 36 78 Z" fill="url(#flameOuter)" opacity="0.85"/>
      <path d="M 22 78 C 16 66, 20 50, 26 40 C 32 52, 36 66, 30 78 Z" fill="#fef08a"/>
    </g>
  </g>

  <!-- Floating Code Symbols (static translated wrappers) -->
  <g transform="translate(56, 56)">
    <g class="sym-float">
      <rect width="68" height="32" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="34" y="22" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="16" font-weight="700">{ }</text>
    </g>
  </g>
  <g transform="translate(76, 122)">
    <g class="sym-float-alt">
      <rect width="78" height="32" rx="9" fill="#0f172a" stroke="#fb923c" stroke-width="2"/>
      <text x="39" y="21" text-anchor="middle" fill="#fdba74" font-family="Consolas, monospace" font-size="15" font-weight="700">&lt;/&gt;</text>
    </g>
  </g>
  <g transform="translate(812, 54)">
    <g class="sym-float-alt">
      <rect width="84" height="32" rx="9" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
      <text x="42" y="21" text-anchor="middle" fill="#22d3ee" font-family="Consolas, monospace" font-size="15" font-weight="700">() =&gt;</text>
    </g>
  </g>
  <g transform="translate(796, 118)">
    <g class="sym-float">
      <rect width="106" height="32" rx="9" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
      <text x="53" y="21" text-anchor="middle" fill="#fca5a5" font-family="Consolas, monospace" font-size="13" font-weight="700">undefined</text>
    </g>
  </g>

  <!-- Comic Speech Bubble: "This is fine." -->
  <g transform="translate(184, 28)">
    <rect x="0" y="0" width="246" height="54" rx="16" fill="#fefce8" stroke="#0f172a" stroke-width="3.5"/>
    <polygon points="96,53 122,53 114,72" fill="#fefce8" stroke="#0f172a" stroke-width="3.5"/>
    <rect x="93" y="48" width="32" height="8" fill="#fefce8"/>
    <text x="123" y="23" text-anchor="middle" fill="#0f172a" font-family="'Comic Sans MS', 'Segoe UI', sans-serif" font-size="13.5" font-weight="700">0 errors, 47 warnings...</text>
    <text x="123" y="42" text-anchor="middle" fill="#dc2626" font-family="'Comic Sans MS', 'Segoe UI', sans-serif" font-size="15" font-weight="800">This is fine. ☕</text>
  </g>

  <!-- Desk Surface & Legs -->
  <g transform="translate(70, 288)">
    <rect x="0" y="0" width="820" height="18" rx="6" fill="#d97706" stroke="#0f172a" stroke-width="3"/>
    <rect x="44" y="18" width="16" height="74" fill="#92400e" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="760" y="18" width="16" height="74" fill="#92400e" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- Wooden Chair Behind Stick-Figure -->
  <g transform="translate(230, 182)">
    <rect x="0" y="0" width="88" height="106" rx="14" fill="#78350f" stroke="#0f172a" stroke-width="3"/>
    <rect x="12" y="14" width="64" height="20" rx="5" fill="#92400e"/>
  </g>

  <!-- Stick-Figure Comic Developer Character -->
  <g transform="translate(226, 98)">
    <!-- Stick Legs under desk edge -->
    <path d="M 38 148 L 28 190" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 62 148 L 72 190" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Hoodie Torso (classic comic stick-figure wearing oversized dev hoodie) -->
    <path d="M 24 148 C 24 100, 76 100, 76 148 Z" fill="#0284c7" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="50" y="136" text-anchor="middle" fill="#e0f2fe" font-family="Consolas, monospace" font-size="11" font-weight="700">&lt;/&gt;</text>

    <!-- Left Stick Arm holding Giant Steaming Coffee Mug -->
    <path d="M 28 118 Q -4 128 8 150" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <!-- Right Stick Arm typing on Laptop/Keyboard -->
    <path d="M 74 118 Q 118 134 156 176" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>

    <!-- Steaming Coffee Mug in Hand -->
    <g transform="translate(-20, 128)">
      <g class="steam-1">
        <path d="M 10 -4 C 6 -12, 16 -18, 11 -26" fill="none" stroke="#fef08a" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <g class="steam-2">
        <path d="M 21 -6 C 17 -14, 27 -20, 22 -28" fill="none" stroke="#e2e8f0" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <path d="M 28 8 C 38 8, 38 24, 28 24" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="0" y="0" width="28" height="32" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
      <rect x="3" y="3" width="22" height="6" rx="2" fill="#451a03"/>
      <text x="14" y="23" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="8.5" font-weight="800">10x</text>
    </g>

    <!-- Stick Neck & Oversized Comic Round Head -->
    <line x1="50" y1="88" x2="50" y2="106" stroke="#0f172a" stroke-width="5"/>
    <circle cx="50" cy="54" r="36" fill="#fef9c3" stroke="#0f172a" stroke-width="3.5"/>

    <!-- Cute Little Bowler / Beanie Hat (classic meme nod!) -->
    <path d="M 22 30 Q 50 16 78 30 Z" fill="#4f46e5" stroke="#0f172a" stroke-width="3"/>
    <rect x="18" y="28" width="64" height="8" rx="4" fill="#312e81" stroke="#0f172a" stroke-width="2.5"/>

    <!-- Sweating Drop on Temple -->
    <path d="M 24 50 C 20 56, 20 62, 24 62 C 28 62, 28 56, 24 50 Z" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Big Caffeine-Wired Comic Eyes + Glasses -->
    <circle cx="44" cy="54" r="9.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.8"/>
    <circle cx="68" cy="54" r="9.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.8"/>
    <!-- Tiny pupils staring intently -->
    <circle cx="47" cy="54" r="3.2" fill="#0f172a"/>
    <circle cx="71" cy="54" r="3.2" fill="#0f172a"/>
    <!-- Bridge of glasses -->
    <line x1="53.5" y1="54" x2="58.5" y2="54" stroke="#0f172a" stroke-width="2.8"/>
    <line x1="20" y1="50" x2="34.5" y2="52" stroke="#0f172a" stroke-width="2.5"/>

    <!-- Slightly Wobbly Calm "This is Fine" Smile -->
    <path d="M 40 72 Q 56 83 72 71" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Glowing Monitor on Desk (Right-Center) -->
  <g transform="translate(420, 82)">
    <rect x="148" y="176" width="44" height="30" fill="#475569" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="118" y="200" width="104" height="8" rx="4" fill="#64748b" stroke="#0f172a" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="178" rx="12" fill="#0f172a" stroke="#f8fafc" stroke-opacity="0.35" stroke-width="3"/>
    <rect x="12" y="12" width="316" height="154" rx="6" fill="#090d16"/>

    <!-- Window Controls -->
    <circle cx="26" cy="24" r="4" fill="#f87171"/>
    <circle cx="40" cy="24" r="4" fill="#fbbf24"/>
    <circle cx="54" cy="24" r="4" fill="#34d399"/>
    <text x="176" y="27" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">deploy-friday-5pm.ts</text>

    <!-- Code Lines -->
    <rect x="26" y="44" width="88" height="7" rx="3.5" fill="#f87171"/>
    <rect x="122" y="44" width="132" height="7" rx="3.5" fill="#fbbf24"/>
    <rect x="44" y="60" width="166" height="7" rx="3.5" fill="#38bdf8"/>
    <rect x="44" y="76" width="194" height="7" rx="3.5" fill="#cbd5e1" opacity="0.72"/>
    <rect x="62" y="92" width="138" height="7" rx="3.5" fill="#34d399"/>
    <rect x="44" y="108" width="90" height="7" rx="3.5" fill="#22d3ee"/>

    <!-- Blinking Cursor -->
    <rect x="140" y="106" width="9" height="12" rx="1.5" fill="#facc15" class="cursor-blink"/>

    <!-- Funny Terminal Bar -->
    <rect x="22" y="132" width="296" height="22" rx="5" fill="#1e293b"/>
    <text x="30" y="146" fill="#34d399" font-family="Consolas, monospace" font-size="9.5" font-weight="700">$ git push --force  # tests passed locally!</text>
  </g>

  <!-- Keyboard on Desk -->
  <g transform="translate(366, 276)">
    <rect x="0" y="0" width="112" height="12" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- Nervous Comic Rubber Duck on Right Side of Desk -->
  <g transform="translate(778, 240)">
    <ellipse cx="22" cy="34" rx="18" ry="13" fill="#facc15" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="18" cy="17" r="11" fill="#fde047" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="14" cy="15" r="3" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="13.5" cy="15" r="1.2" fill="#0f172a"/>
    <path d="M 3 16 L 10 14 L 10 20 L 3 18 Z" fill="#f97316" stroke="#0f172a" stroke-width="2"/>
    <text x="38" y="8" fill="#fef08a" font-family="'Comic Sans MS', sans-serif" font-size="11" font-weight="700">quack?!</text>
  </g>
</svg>
