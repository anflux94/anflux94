<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Attia Nassar — Senior Full Stack and Applied AI Engineer</title>
  <desc id="heroDesc">Dark gradient hero banner with centered name, cyan-indigo accent bar, role subtitle, and engineering tagline.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="82%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="subtleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .pulse-dot { animation: dotPulse 3.2s ease-in-out infinite; }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.95; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot { animation: none; opacity: 0.8; }
    }
  </style>

  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#subtleGrid)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glowLeft)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glowRight)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="15" fill="none" stroke="#334155" stroke-opacity="0.65" stroke-width="1.5"/>

  <!-- Static positioned decorative terminal nodes (no CSS transform animation on translated groups) -->
  <g transform="translate(88, 72)">
    <circle cx="0" cy="0" r="5" fill="#22d3ee" class="pulse-dot"/>
    <circle cx="20" cy="0" r="5" fill="#38bdf8" opacity="0.6"/>
    <circle cx="40" cy="0" r="5" fill="#818cf8" opacity="0.45"/>
  </g>

  <g transform="translate(1060, 248)">
    <rect x="0" y="0" width="52" height="6" rx="3" fill="#22d3ee" opacity="0.4"/>
    <rect x="16" y="14" width="36" height="6" rx="3" fill="#818cf8" opacity="0.35"/>
  </g>

  <!-- Centered Identity Block -->
  <g transform="translate(600, 118)">
    <text x="0" y="0" text-anchor="middle" fill="#f8fafc" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" letter-spacing="1.5">
      Attia Nassar
    </text>
  </g>

  <g transform="translate(460, 144)">
    <rect x="0" y="0" width="280" height="5" rx="2.5" fill="url(#accentBar)"/>
  </g>

  <g transform="translate(600, 186)">
    <text x="0" y="0" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="0.8">
      Senior Full Stack &amp; Applied AI Engineer
    </text>
  </g>

  <g transform="translate(600, 232)">
    <text x="0" y="0" text-anchor="middle" fill="#cbd5e1" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="16" letter-spacing="0.4">
      TypeScript · React / Next.js · Node.js / NestJS · RAG &amp; Tool-Calling Agents · AWS &amp; MongoDB
    </text>
  </g>
</svg>
